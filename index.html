<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>YOU'RE IN EUROPE</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #fff9fb;
            margin: 0;
            padding: 0;
            color: #4a5568;
        }
        header {
            background-color: #ffffff;
            border-bottom: 3px dashed #ffb6c1;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 192, 203, 0.15);
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff69b4;
            text-decoration: none;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            text-decoration: none;
            color: #4a5568;
            font-weight: bold;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #ff69b4;
        }
        /* Style untuk Dropdown Menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 180px;
            box-shadow: 0 8px 20px rgba(255, 192, 203, 0.3);
            border: 2px dashed #ffb6c1;
            border-radius: 12px;
            z-index: 1;
            top: 100%;
            left: 0;
            overflow: hidden;
        }
        .dropdown-content a {
            color: #4a5568;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #fff0f5;
            color: #ff69b4;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .main-frame {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="Home.html" target="konten" class="logo">✈️ YOU'RE IN EUROPE</a>
        <nav>
            <a href="Home.html" target="konten">Home</a>
            <a href="Profil.html" target="konten">Profil</a>
            
            <!-- TOMBOL TUJUAN DITAMBAHKAN DI SINI -->
            <a href="tujuan.html" target="konten">Tujuan</a>
            
            <!-- Menu Dropdown untuk Tour & Layanan -->
            <div class="dropdown">
                <a href="#" style="cursor: pointer;">Tour Packages ▾</a>
                <div class="dropdown-content">
                    <a href="tourpackage.html" target="konten">🌸 Katalog Musim</a>
                    <a href="Booking.html" target="konten">📝 Form Booking Tour</a>
                </div>
            </div>

            <a href="Kontak.html" target="konten">Kontak</a>
            <a href="Source.html" target="konten">Source</a>
        </nav>
    </header>

    <!-- Area Konten Iframe -->
    <iframe src="Home.html" name="konten" class="main-frame"></iframe>

</body>
</html>
